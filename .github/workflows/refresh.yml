name: refresh

on:
  schedule:
    - cron: "30 1 * * *" # 北京时间每天 09:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-readme.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/competitions.csv
          git diff --cached --quiet && echo "no changes, skip commit" || git commit -m "chore: refresh competition status"
          git push
